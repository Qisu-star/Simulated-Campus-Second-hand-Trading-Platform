openapi: 3.1.0
info:
  title: Campus Second-hand Trading Platform API
  version: 0.1.0
servers:
  - url: http://localhost:7001
paths:
  /api/auth/register:
    post:
      operationId: register
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 注册成功，返回用户信息和认证凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: 输入验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      operationId: login
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 登录成功，返回用户信息和认证凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      operationId: logout
      summary: 用户注销
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 注销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前登录用户信息
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/password:
    put:
      operationId: updatePassword
      summary: 修改密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordInput"
      responses:
        "200":
          description: 密码修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 当前密码错误或新密码验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/items:
    get:
      operationId: listItems
      summary: 获取商品列表（分页，可选分类筛选）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
        - name: category
          in: query
          schema:
            type: string
          description: 分类筛选（可选，传"全部"或不传则不筛选）
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
    post:
      operationId: createItem
      summary: 发布商品（需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Item"
        "400":
          description: 输入验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/items/search:
    get:
      operationId: searchItems
      summary: 搜索商品（关键词匹配名称、描述、分类，可选分类筛选）
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - name: category
          in: query
          schema:
            type: string
          description: 分类筛选（可选，与搜索叠加）
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
  /api/items/{id}:
    get:
      operationId: getItemById
      summary: 获取商品详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Item"
        "400":
          description: 无效的商品 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品不存在或已下架
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateItem
      summary: 编辑商品（需认证，仅拥有者）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Item"
        "400":
          description: 无效的输入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 无权修改此商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/items/{id}/status:
    patch:
      operationId: updateItemStatus
      summary: 变更商品状态（下架/上架，需认证，仅拥有者）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemStatusInput"
      responses:
        "200":
          description: 状态变更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 无效的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 无权修改此商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/items/mine:
    get:
      operationId: listMyItems
      summary: 查看自己的商品（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories:
    get:
      operationId: listCategories
      summary: 获取固定分类列表
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: string
  /api/sellers/{id}:
    get:
      operationId: getSellerInfo
      summary: 获取商家基本信息
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商家 ID
      responses:
        "200":
          description: 商家信息
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SellerInfo"
        "400":
          description: 无效的商家 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商家不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/sellers/{id}/items:
    get:
      operationId: listSellerItems
      summary: 获取商家商品列表（仅含在售商品）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商家 ID
        - name: category
          in: query
          schema:
            type: string
          description: 分类筛选（可选，传"全部"或不传则不筛选）
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "400":
          description: 无效的商家 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商家不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/items/{id}/reviews:
    get:
      operationId: listItemReviews
      summary: 获取商品评价列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 评价列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "400":
          description: 无效的商品 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/reviews:
    get:
      operationId: listPendingReviews
      summary: 查看待审核商品列表（仅管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 待审核商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 仅管理员可执行此操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/reviews/{id}/approve:
    post:
      operationId: approveItem
      summary: 审核通过商品（仅管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
      responses:
        "200":
          description: 审核通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 仅管理员可执行此操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/reviews/{id}/reject:
    post:
      operationId: rejectItem
      summary: 审核驳回商品（仅管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
      responses:
        "200":
          description: 已驳回
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 仅管理员可执行此操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/reviews:
    post:
      operationId: createReview
      summary: 提交评价（需认证，仅已签收买家）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewInput"
      responses:
        "201":
          description: 评价创建成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          description: 参数错误或评分无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 无权评价此订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 已评价过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/sellers/{id}/reviews:
    get:
      operationId: listSellerReviews
      summary: 获取商家近期评价（预留）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商家 ID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            default: 30
          description: 查询近多少天的评价
      responses:
        "200":
          description: 评价列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "400":
          description: 无效的商家 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 商家不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/favorites/items:
    get:
      operationId: listFavoriteItems
      summary: 获取收藏商品列表（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 收藏商品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteItemListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/favorites/items/{id}:
    post:
      operationId: toggleFavoriteItem
      summary: 收藏商品（切换式，需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
      responses:
        "200":
          description: 收藏切换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleFavoriteResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfavoriteItem
      summary: 取消收藏商品（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商品 ID
      responses:
        "200":
          description: 取消收藏成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/favorites/sellers:
    get:
      operationId: listFavoriteSellers
      summary: 获取收藏商家列表（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 收藏商家列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteSellerListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/favorites/sellers/{id}:
    post:
      operationId: toggleFavoriteSeller
      summary: 收藏商家（切换式，需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商家 ID
      responses:
        "200":
          description: 收藏切换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleFavoriteResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfavoriteSeller
      summary: 取消收藏商家（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 商家 ID
      responses:
        "200":
          description: 取消收藏成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account:
    get:
      operationId: getAccount
      summary: 查看账户信息（需认证）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 账户信息（余额、是否已设置支付密码）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AccountInfo"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account/balance:
    put:
      operationId: setBalance
      summary: 设置账户余额（演示用途，需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBalanceInput"
      responses:
        "200":
          description: 余额更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
        "400":
          description: 无效的余额值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account/password:
    put:
      operationId: setPaymentPassword
      summary: 设置支付密码（6 位数字，需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPaymentPasswordInput"
      responses:
        "200":
          description: 支付密码设置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 支付密码格式错误（非 6 位数字）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account/verify-password:
    post:
      operationId: verifyPaymentPassword
      summary: 验证支付密码（需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentPasswordInput"
      responses:
        "200":
          description: 支付密码验证通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 支付密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cart:
    post:
      operationId: addToCart
      summary: 加入购物车（需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartInput"
      responses:
        "201":
          description: 已加入购物车
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 商品已下架或售罄
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listCart
      summary: 查看购物车（需认证）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 购物车商品列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cart/{id}:
    delete:
      operationId: removeFromCart
      summary: 删除购物车商品（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 已从购物车移除
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 购物车项不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cart/{id}/select:
    patch:
      operationId: toggleCartSelect
      summary: 切换购物车商品勾选状态（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected:
                  type: boolean
      responses:
        "200":
          description: 勾选状态已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 购物车项不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cart/checkout:
    post:
      operationId: checkout
      summary: 结算勾选商品（需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: 结算成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orderId:
                        type: integer
        "400":
          description: 库存不足或支付密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: 余额不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cart/buy-now:
    post:
      operationId: buyNow
      summary: 立即购买（需认证）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyNowInput"
      responses:
        "200":
          description: 购买成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orderId:
                        type: integer
        "400":
          description: 商品已售罄或支付密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: 余额不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/orders:
    get:
      operationId: listOrders
      summary: 查看我的购买订单（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/orders/sales:
    get:
      operationId: listSales
      summary: 查看售出订单（需认证）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 售出订单列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/orders/{id}/receive:
    post:
      operationId: confirmReceive
      summary: 确认签收（需认证，仅买家可操作）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 已确认签收
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 订单状态错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 无权操作此订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: hex
  schemas:
    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          pattern: "^[一-龥a-zA-Z0-9]+$"
        password:
          type: string
          minLength: 6
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UpdatePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
    AuthResponse:
      type: object
      required: [data, token]
      properties:
        data:
          $ref: "#/components/schemas/User"
        token:
          type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Item:
      type: object
      required: [id, title, price, quantity, description, images, coverImage, category, sellerId, sellerName, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer
        description:
          type: string
        images:
          type: array
          items:
            type: string
        coverImage:
          type: string
        category:
          type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        status:
          type: string
          enum: [pending, active, delisted]
        createdAt:
          type: string
          format: date-time
        quantityUpdatedAt:
          type: string
          format: date-time
          nullable: true
        isItemFavorited:
          type: boolean
          description: 当前用户是否收藏该商品（仅登录用户返回有效值）
        isSellerFavorited:
          type: boolean
          description: 当前用户是否收藏该商家（仅登录用户返回有效值）
    ItemListResponse:
      type: object
      required: [data, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total:
          type: integer
        totalPages:
          type: integer
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title, price, quantity, category]
      properties:
        title:
          type: string
          description: 商品名称
        price:
          type: number
          format: float
          exclusiveMinimum: 0
          description: 商品价格，必须大于 0
        quantity:
          type: integer
          minimum: 0
          description: 商品数量，必须为非负整数
        description:
          type: string
          description: 商品描述（可选）
        category:
          type: string
          description: 商品分类，必须是合法分类之一
        images:
          type: array
          items:
            type: string
          description: 图片 URL 列表（可选）
    UpdateItemInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: 商品名称
        price:
          type: number
          format: float
          exclusiveMinimum: 0
          description: 商品价格，必须大于 0
        quantity:
          type: integer
          minimum: 0
          description: 商品数量，必须为非负整数
        description:
          type: string
          description: 商品描述
        category:
          type: string
          description: 商品分类
        images:
          type: array
          items:
            type: string
          description: 图片 URL 列表
        coverImage:
          type: string
          description: 封面图片 URL
    UpdateItemStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [delisted, active]
          description: 目标状态
    SellerInfo:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    ToggleFavoriteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [favorited, unfavorited]
    FavoriteItemWithInfo:
      type: object
      required: [id, userId, itemId, createdAt, item]
      properties:
        id:
          type: integer
        userId:
          type: integer
        itemId:
          type: integer
        createdAt:
          type: string
          format: date-time
        item:
          $ref: "#/components/schemas/Item"
    FavoriteItemListResponse:
      type: object
      required: [data, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteItemWithInfo"
        total:
          type: integer
        totalPages:
          type: integer
    FavoriteSellerWithInfo:
      type: object
      required: [id, userId, sellerId, createdAt, sellerName, activeItemCount]
      properties:
        id:
          type: integer
        userId:
          type: integer
        sellerId:
          type: integer
        createdAt:
          type: string
          format: date-time
        sellerName:
          type: string
        activeItemCount:
          type: integer
    FavoriteSellerListResponse:
      type: object
      required: [data, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteSellerWithInfo"
        total:
          type: integer
        totalPages:
          type: integer
    AccountInfo:
      type: object
      required: [balance, hasPaymentPassword]
      properties:
        balance:
          type: number
          description: 账户余额
        hasPaymentPassword:
          type: boolean
          description: 是否已设置支付密码
    SetBalanceInput:
      type: object
      additionalProperties: false
      required: [balance]
      properties:
        balance:
          type: number
          description: 要设置的余额值
    SetPaymentPasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          pattern: "^\\d{6}$"
          description: 6 位数字支付密码
    VerifyPaymentPasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: 支付密码
    AddToCartInput:
      type: object
      additionalProperties: false
      required: [itemId, quantity]
      properties:
        itemId:
          type: integer
          description: 商品 ID
        quantity:
          type: integer
          minimum: 1
          description: 数量
    CartItem:
      type: object
      required: [id, userId, itemId, quantity, selected, createdAt, title, price, coverImage, stock, status]
      properties:
        id:
          type: integer
        userId:
          type: integer
        itemId:
          type: integer
        quantity:
          type: integer
        selected:
          type: boolean
        createdAt:
          type: string
          format: date-time
        title:
          type: string
        price:
          type: number
        coverImage:
          type: string
        stock:
          type: integer
        status:
          type: string
    CheckoutInput:
      type: object
      additionalProperties: false
      required: [paymentPassword]
      properties:
        paymentPassword:
          type: string
          description: 支付密码
    BuyNowInput:
      type: object
      additionalProperties: false
      required: [itemId, quantity, paymentPassword]
      properties:
        itemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        paymentPassword:
          type: string
    OrderItem:
      type: object
      required: [id, orderId, itemId, sellerId, title, price, quantity, coverImage]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        itemId:
          type: integer
        sellerId:
          type: integer
        title:
          type: string
        price:
          type: number
        quantity:
          type: integer
        coverImage:
          type: string
    Order:
      type: object
      required: [id, userId, totalPrice, status, createdAt, items]
      properties:
        id:
          type: integer
        userId:
          type: integer
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending_receipt, received]
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderListResponse:
      type: object
      required: [data, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        totalPages:
          type: integer
    Review:
      type: object
      required: [id, userId, orderId, itemId, sellerId, rating, comment, username, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderId:
          type: integer
        itemId:
          type: integer
        sellerId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 10
        comment:
          type: string
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateReviewInput:
      type: object
      additionalProperties: false
      required: [orderId, itemId, rating]
      properties:
        orderId:
          type: integer
        itemId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 10
        comment:
          type: string
          description: 评论文本（可选）
    ReviewListResponse:
      type: object
      required: [data, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
        totalPages:
          type: integer
